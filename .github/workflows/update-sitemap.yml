name: Atualizar Sitemap XML Automaticamente

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar paginas SEO estaticas + sitemap.xml
        run: python3 .github/scripts/build_seo_pages.py

      - name: Publicar paginas SEO e sitemap.xml
        run: |
          git config user.name "GUILD IMOB Bot"
          git config user.email "guildimob@gmail.com"
          git add sitemap.xml imovel/
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza paginas SEO estaticas e sitemap.xml automaticamente"
            git push
          else
            echo "Paginas SEO e sitemap ja estao atualizados."
          fi
